# Pay with ARAF — reverse proxy for araf.ng (production). Example for nginx; the same routing maps
# directly to a Kubernetes/OpenShift ingress or a cloud load balancer. TLS certificates for
# araf.ng and *.araf.ng come from the Bank's certificate process. Place a WAF / DDoS service in front.

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

upstream araf_api        { server araf-api.internal:4000;       keepalive 32; }   # API (not the worker)
upstream araf_checkout   { server araf-checkout.internal:3001;  keepalive 32; }
upstream araf_partners   { server araf-partners.internal:3002;  keepalive 16; }
upstream araf_admin      { server araf-admin.internal:3003;     keepalive 8;  }
upstream araf_developers { server araf-developers.internal:3004; keepalive 8; }

# X-Forwarded-For is OVERWRITTEN with the real client address (never appended), so clients cannot
# spoof their IP; the API trusts exactly TRUST_PROXY_HOPS=2 (this proxy + the web app's /api proxy).

# Shared TLS / headers
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:araf:10m;
server_tokens off;
client_max_body_size 6m;            # PDF statements are capped at 5 MB by policy

# HTTP → HTTPS
server {
  listen 80;
  server_name araf.ng www.araf.ng api.araf.ng partners.araf.ng developers.araf.ng admin.araf.ng;
  return 301 https://$host$request_uri;
}

# Apex → www
server {
  listen 443 ssl http2;
  server_name araf.ng;
  ssl_certificate     /etc/tls/araf.ng/fullchain.pem;
  ssl_certificate_key /etc/tls/araf.ng/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  return 301 https://www.araf.ng$request_uri;
}

# www.araf.ng — public site, hosted checkout (/c/…), embed SDK (/v1/araf.js)
server {
  listen 443 ssl http2;
  server_name www.araf.ng;
  ssl_certificate     /etc/tls/araf.ng/fullchain.pem;
  ssl_certificate_key /etc/tls/araf.ng/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # Security headers (CSP incl. per-session frame-ancestors) are set by the app itself.
  location /v1/ {                      # SDK loaded by merchant websites; short cache so fixes roll out fast
    proxy_pass http://araf_checkout;
    proxy_set_header Host $host;
    proxy_cache_valid 200 5m;
  }
  location / {
    proxy_pass http://araf_checkout;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
  }
}

# api.araf.ng — partner API (server-to-server), provider callbacks, health
server {
  listen 443 ssl http2;
  server_name api.araf.ng;
  ssl_certificate     /etc/tls/araf.ng/fullchain.pem;
  ssl_certificate_key /etc/tls/araf.ng/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  location /metrics      { deny all; }                    # scrape from the private network only
  location /api/admin/   { deny all; }                    # staff API only via admin.araf.ng
  location /api/sandbox/ { deny all; }                    # simulators never exposed in production
  location / {
    proxy_pass http://araf_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
  }
}

# partners.araf.ng — Partner portal
server {
  listen 443 ssl http2;
  server_name partners.araf.ng;
  ssl_certificate     /etc/tls/araf.ng/fullchain.pem;
  ssl_certificate_key /etc/tls/araf.ng/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  location / { proxy_pass http://araf_partners; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto https; }
}

# developers.araf.ng — public documentation
server {
  listen 443 ssl http2;
  server_name developers.araf.ng;
  ssl_certificate     /etc/tls/araf.ng/fullchain.pem;
  ssl_certificate_key /etc/tls/araf.ng/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  location / { proxy_pass http://araf_developers; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
}

# admin.araf.ng — Bank staff only. Serve from an INTERNAL listener / internal DNS; the allowlist is
# a second line of defence (replace with the Bank's VPN / zero-trust ranges).
server {
  listen 443 ssl http2;
  server_name admin.araf.ng;
  ssl_certificate     /etc/tls/araf.ng/fullchain.pem;
  ssl_certificate_key /etc/tls/araf.ng/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  allow 10.0.0.0/8;          # example: Bank internal network
  deny all;
  location / { proxy_pass http://araf_admin; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto https; }
}
